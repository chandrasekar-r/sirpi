<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>GLB tools</title>
<script type="importmap">
{ "imports": {
  "three": "forge://app/vendor/three/build/three.module.js",
  "three/addons/": "forge://app/vendor/three/examples/jsm/"
} }
</script>
</head>
<body>
<script type="module">
// Headless worker page: load a GLB, run the requested passes, and return a new GLB (or OBJ).
//   ops: { subdivide: { levels, creaseAngle }, lightmapUVs: { resolution }, format: 'glb' | 'obj' }
//   or ops: { views: { reference, cell } } returns a JPEG contact sheet of renders instead.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { OBJExporter } from 'three/addons/exporters/OBJExporter.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { enhanceScene } from './subdivide.js';
import { addLightmapUVs, bakeMaterialColors } from './glbtools.js';

const post = (m) => { try { window.webkit.messageHandlers.forge.postMessage(m); } catch (_) {} };
const toBase64 = (buf) => {
  const bytes = new Uint8Array(buf); let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
};

// Contact sheet for a vision model: the reference picture on the left, four renders of the asset on the right.
//   views: { reference: url | null, cell: px }
async function renderViews(root, { reference = null, cell = 384 } = {}) {
  const W = reference ? cell * 4 : cell * 2, H = cell * 2;
  const sheet = document.createElement('canvas'); sheet.width = W; sheet.height = H;
  const ctx = sheet.getContext('2d');
  ctx.fillStyle = '#c9cbce'; ctx.fillRect(0, 0, W, H);
  const label = (text, x, y) => {
    ctx.font = '600 15px -apple-system, system-ui, sans-serif';
    const w = ctx.measureText(text).width + 14;
    ctx.fillStyle = 'rgba(20,22,25,.78)'; ctx.fillRect(x + 8, y + 8, w, 24);
    ctx.fillStyle = '#fff'; ctx.fillText(text, x + 15, y + 25);
  };
  let x0 = 0;
  if (reference) {
    const img = new Image(); img.src = reference;
    await img.decode();
    const box = cell * 2, s = Math.min(box / img.width, box / img.height);
    const w = img.width * s, h = img.height * s;
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, box, box);
    ctx.drawImage(img, (box - w) / 2, (box - h) / 2, w, h);
    label('REFERENCE', 0, 0);
    ctx.fillStyle = '#141619'; ctx.fillRect(box - 2, 0, 4, H);
    x0 = box;
  }
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(1); renderer.setSize(cell, cell);
  renderer.toneMapping = THREE.NeutralToneMapping;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xc9cbce);
  scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
  scene.environmentIntensity = 0.6;
  scene.add(new THREE.HemisphereLight(0xffffff, 0x666666, 0.9));
  const sun = new THREE.DirectionalLight(0xffffff, 1.3); sun.position.set(3, 6, 4); scene.add(sun);
  scene.add(root);
  root.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(root);
  const c = box.getCenter(new THREE.Vector3()), radius = Math.max(1e-6, box.getSize(new THREE.Vector3()).length() / 2);
  const camera = new THREE.PerspectiveCamera(30, 1, radius / 100, radius * 100);
  const dist = radius / Math.sin(THREE.MathUtils.degToRad(15)) * 1.05;
  const views = [
    ['FRONT', [0, 0.12, 1]], ['RIGHT SIDE', [1, 0.12, 0]],
    ['THREE-QUARTER', [1, 0.7, 1]], ['BACK', [0, 0.12, -1]],
  ];
  views.forEach(([name, dir], i) => {
    const d = new THREE.Vector3(...dir).normalize();
    camera.position.copy(c).addScaledVector(d, dist);
    camera.lookAt(c);
    renderer.render(scene, camera);
    const x = x0 + (i % 2) * cell, y = Math.floor(i / 2) * cell;
    ctx.drawImage(renderer.domElement, x, y, cell, cell);
    label(name, x, y);
  });
  ctx.strokeStyle = 'rgba(20,22,25,.35)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x0 + cell, 0); ctx.lineTo(x0 + cell, H); ctx.moveTo(x0, cell); ctx.lineTo(W, cell); ctx.stroke();
  renderer.dispose();
  return sheet.toDataURL('image/jpeg', 0.88);
}

window.glbTool = async (url, ops, requestId) => {
  try {
    ops = ops || {};
    const gltf = await new GLTFLoader().loadAsync(url);
    const t0 = performance.now();
    const stats = { three: THREE.REVISION };
    if (ops.views) {
      const sheet = await renderViews(gltf.scene, ops.views);
      post({ type: 'glbTool', requestId, format: 'jpeg', data: sheet.split(',')[1], stats });
      return true;
    }
    if (ops.subdivide) stats.subdivide = enhanceScene(gltf.scene, ops.subdivide);
    if (ops.lightmapUVs) stats.lightmapUVs = addLightmapUVs(gltf.scene, ops.lightmapUVs);
    let data, format = ops.format || 'glb';
    if (format === 'obj') {
      stats.colors = bakeMaterialColors(gltf.scene);
      data = new TextEncoder().encode(new OBJExporter().parse(gltf.scene)).buffer;
    } else {
      data = await new GLTFExporter().parseAsync(gltf.scene, { binary: true, animations: gltf.animations || [] });
    }
    stats.ms = Math.round(performance.now() - t0);
    post({ type: 'glbTool', requestId, format, data: toBase64(data), stats });
  } catch (e) {
    post({ type: 'glbTool', requestId, error: String((e && (e.stack || e.message)) || e) });
  }
  return true;
};
post({ type: 'enhanceReady' });
</script>
</body>
</html>
