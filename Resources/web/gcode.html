<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Slice preview</title>
<style>
  :root { color-scheme: dark; --panel:rgba(30,32,36,.85); --fg:#e8e8ea; --muted:#9a9ca3; }
  html,body { margin:0; height:100%; overflow:hidden; background:#1d1f22; color:var(--fg); font:12px -apple-system, system-ui, sans-serif; }
  canvas { display:block; }
  .panel { position:absolute; background:var(--panel); border-radius:8px; padding:8px 10px; backdrop-filter:blur(8px); }
  #legend { left:14px; top:14px; border-radius:14px; border:1px solid rgba(255,255,255,.09); line-height:1.7; }
  #legend summary { cursor:pointer; list-style:none; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
  #legend summary::-webkit-details-marker { display:none; }
  #legend label { display:flex; align-items:center; gap:6px; cursor:pointer; }
  #legend i { width:10px; height:10px; border-radius:2px; display:inline-block; }
  #layers { right:16px; top:60px; bottom:76px; width:54px; border-radius:999px; border:1px solid rgba(255,255,255,.09); box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 14px 44px rgba(8,9,11,.45); padding:14px 0; box-sizing:border-box; display:flex; flex-direction:column; align-items:center; gap:6px; }
  #layers input[type=range] { writing-mode: vertical-lr; direction: rtl; flex:1; width:22px; accent-color:#C8F25A; }
  #layerLabel { font-variant-numeric: tabular-nums; text-align:center; font-size:11px; }
  #opts { left:10px; bottom:10px; display:flex; gap:12px; }
  #msg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:14px; pointer-events:none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/build/three.module.js",
  "three/addons/": "./vendor/three/examples/jsm/"
} }
</script>
</head>
<body>
<details id="legend" class="panel" hidden><summary>Features ▾</summary><div id="legendList"></div></details>
<div id="layers" class="panel" hidden>
  <div id="layerLabel"></div>
  <input id="slider" type="range" min="1" max="1" value="1">
</div>
<div id="opts" class="panel" hidden style="display:none">
  <label id="byToolWrap"><input id="byTool" type="checkbox"> Filament colours</label>
  <label><input id="single" type="checkbox"> Single layer</label>
  <label><input id="travel" type="checkbox"> Travel moves</label>
</div>
<div id="msg">Loading G-code…</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const TOOL_COLORS = (new URLSearchParams(location.search).get('colors') || '').split(',').filter(Boolean).map((h) => '#' + h.replace('#', ''));
const post = (m) => { try { webkit.messageHandlers.forge.postMessage(m); } catch (_) {} };
const PLATE = 256;
const FEATURES = {
  'Outer wall': 0xff8c1a, 'Inner wall': 0xffd23f, 'Overhang wall': 0x2f6bff, 'Sparse infill': 0xb3242a,
  'Internal solid infill': 0x9b3fd6, 'Top surface': 0xff4a4a, 'Bottom surface': 0x4aa3ff, 'Bridge': 0x52c7d6,
  'Gap infill': 0xffffff, 'Support': 0x3dd68c, 'Support interface': 0x1f9e64, 'Support transition': 0x6fd6a0,
  'Brim': 0x7fd1b9, 'Skirt': 0x7fd1b9, 'Floating vertical shell': 0xc9a0ff, 'Prime tower': 0x8a8f99,
  'Ironing': 0xff9ec7, 'Custom': 0x6b6f78, 'Other': 0x9a9ca3,
};

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const BG = new THREE.Color(0x1d1f22);
scene.background = BG;
const camera = new THREE.PerspectiveCamera(40, 1, 1, 5000);
camera.position.set(220, 200, 260);
const controls = new OrbitControls(camera, renderer.domElement);
const grid = new THREE.GridHelper(PLATE, 16, 0x4a4d55, 0x34363b); scene.add(grid);
function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });

// ---- parse ----
function parse(text) {
  const ext = { pos: [], col: [], tcol: [], feat: [], layerStart: [0], layerZ: [] };
  let tool = 0; const toolsUsed = new Set();
  const trav = { pos: [], layerStart: [0] };
  let x = 0, y = 0, z = 0, e = 0, absXYZ = true, absE = false;
  let feature = 'Other', layer = 0, layerZ = 0, sawLayerMarker = false;
  const featIndex = new Map(); const featNames = [];
  const fi = (name) => { if (!featIndex.has(name)) { featIndex.set(name, featNames.length); featNames.push(name); } return featIndex.get(name); };
  const color = new THREE.Color();
  const pushSeg = (x0, y0, z0, x1, y1, z1, extruding) => {
    // printer Z-up -> viewer Y-up, centred
    if (extruding) {
      ext.pos.push(x0 - PLATE / 2, z0, -(y0 - PLATE / 2), x1 - PLATE / 2, z1, -(y1 - PLATE / 2));
      color.setHex(FEATURES[feature] ?? FEATURES.Other);
      ext.col.push(color.r, color.g, color.b, color.r, color.g, color.b);
      const f = fi(feature); ext.feat.push(f, f);
      color.set(TOOL_COLORS[tool] || '#9a9ca3');
      ext.tcol.push(color.r, color.g, color.b, color.r, color.g, color.b);
      toolsUsed.add(tool);
    } else {
      trav.pos.push(x0 - PLATE / 2, z0, -(y0 - PLATE / 2), x1 - PLATE / 2, z1, -(y1 - PLATE / 2));
    }
  };
  const newLayer = () => {
    if (ext.pos.length / 6 === ext.layerStart[ext.layerStart.length - 1]) return; // skip empty layers
    ext.layerStart.push(ext.pos.length / 6); trav.layerStart.push(trav.pos.length / 6);
    ext.layerZ.push(layerZ); layer++;
  };
  const lines = text.split('\n');
  for (let li = 0; li < lines.length; li++) {
    let line = lines[li];
    if (line.charCodeAt(0) === 59) { // ';'
      if (line.startsWith('; CHANGE_LAYER') || line.startsWith(';LAYER_CHANGE')) { sawLayerMarker = true; newLayer(); }
      else if (line.startsWith('; FEATURE:') || line.startsWith(';TYPE:')) feature = line.slice(line.indexOf(':') + 1).trim();
      else if (line.startsWith('; Z_HEIGHT:')) layerZ = parseFloat(line.slice(11));
      continue;
    }
    const sc = line.indexOf(';'); if (sc >= 0) line = line.slice(0, sc);
    line = line.trim(); if (!line) continue;
    const cmd = line.split(/\s+/)[0];
    if (cmd.length > 1 && cmd[0] === 'T') { const t = parseInt(cmd.slice(1), 10); if (t >= 0 && t < 16) tool = t; continue; }
    if (cmd === 'G90') { absXYZ = true; continue; }
    if (cmd === 'G91') { absXYZ = false; continue; }
    if (cmd === 'M82') { absE = true; continue; }
    if (cmd === 'M83') { absE = false; continue; }
    if (cmd === 'G92') { const m = /E(-?[\d.]+)/.exec(line); if (m) e = parseFloat(m[1]); continue; }
    if (cmd !== 'G0' && cmd !== 'G1' && cmd !== 'G2' && cmd !== 'G3') continue;
    const p = {};
    for (const tok of line.split(/\s+/).slice(1)) p[tok[0]] = parseFloat(tok.slice(1));
    const nx = p.X === undefined ? x : (absXYZ ? p.X : x + p.X);
    const ny = p.Y === undefined ? y : (absXYZ ? p.Y : y + p.Y);
    const nz = p.Z === undefined ? z : (absXYZ ? p.Z : z + p.Z);
    let de = 0;
    if (p.E !== undefined) { de = absE ? p.E - e : p.E; e = absE ? p.E : e + p.E; }
    const extruding = de > 0 && (nx !== x || ny !== y);
    if (!sawLayerMarker && extruding && nz > layerZ + 1e-4) { layerZ = nz; newLayer(); }
    if (cmd === 'G2' || cmd === 'G3') {
      const cx = x + (p.I || 0), cy = y + (p.J || 0), r = Math.hypot(x - cx, y - cy);
      let a0 = Math.atan2(y - cy, x - cx), a1 = Math.atan2(ny - cy, nx - cx);
      if (cmd === 'G2') { if (a1 >= a0) a1 -= Math.PI * 2; } else { if (a1 <= a0) a1 += Math.PI * 2; }
      const steps = Math.max(2, Math.ceil(Math.abs(a1 - a0) / (Math.PI / 18)));
      let px = x, py = y, pz = z;
      for (let s = 1; s <= steps; s++) {
        const a = a0 + (a1 - a0) * s / steps;
        const qx = s === steps ? nx : cx + r * Math.cos(a), qy = s === steps ? ny : cy + r * Math.sin(a), qz = z + (nz - z) * s / steps;
        pushSeg(px, py, pz, qx, qy, qz, extruding); px = qx; py = qy; pz = qz;
      }
    } else if (nx !== x || ny !== y || nz !== z) {
      pushSeg(x, y, z, nx, ny, nz, extruding);
    }
    x = nx; y = ny; z = nz;
  }
  ext.layerStart.push(ext.pos.length / 6); trav.layerStart.push(trav.pos.length / 6);
  ext.layerZ.push(layerZ);
  return { ext, trav, featNames, toolsUsed: [...toolsUsed].sort((a, b) => a - b) };
}

let extLines, travLines, data, hidden = new Set();
function applyRange() {
  const n = +slider.value; const single = document.getElementById('single').checked;
  const s = data.ext.layerStart;
  const startSeg = single ? s[n - 1] : 0, endSeg = s[Math.min(n, s.length - 1)];
  extLines.geometry.setDrawRange(startSeg * 2, (endSeg - startSeg) * 2);
  const t = data.trav.layerStart;
  const ts = single ? t[n - 1] : 0, te = t[Math.min(n, t.length - 1)];
  travLines.geometry.setDrawRange(ts * 2, (te - ts) * 2);
  travLines.visible = document.getElementById('travel').checked;
  const zv = data.ext.layerZ[n - 1];
  document.getElementById('layerLabel').innerHTML = `${n - 1}<br>/ ${s.length - 2}<br><span style="color:#9a9ca3">${zv ? zv.toFixed(2) + ' mm' : ''}</span>`;
}

function applyFeatureVisibility() {
  const col = extLines.geometry.attributes.color, feat = data.ext.feat;
  const base = document.getElementById('byTool').checked ? extLines.userData.toolColors : extLines.userData.baseColors;
  for (let i = 0; i < feat.length; i++) {
    const h = hidden.has(feat[i]);
    col.array[i * 3] = h ? BG.r : base[i * 3]; col.array[i * 3 + 1] = h ? BG.g : base[i * 3 + 1]; col.array[i * 3 + 2] = h ? BG.b : base[i * 3 + 2];
  }
  // hidden features are painted background colour; keeps per-layer draw ranges valid
  col.needsUpdate = true;
}

async function load(url) {
  const text = await (await fetch(url)).text();
  data = parse(text);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(data.ext.pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(data.ext.col, 3));
  extLines = new THREE.LineSegments(g, new THREE.LineBasicMaterial({ vertexColors: true }));
  extLines.userData.baseColors = Float32Array.from(data.ext.col);
  extLines.userData.toolColors = Float32Array.from(data.ext.tcol);
  const multi = data.toolsUsed.length > 1;
  document.getElementById('byToolWrap').hidden = !multi;
  document.getElementById('byTool').checked = multi;
  if (multi) applyFeatureVisibility();
  document.getElementById('legend').open = !multi;
  extLines.frustumCulled = false;
  scene.add(extLines);
  const tg = new THREE.BufferGeometry();
  tg.setAttribute('position', new THREE.Float32BufferAttribute(data.trav.pos, 3));
  travLines = new THREE.LineSegments(tg, new THREE.LineBasicMaterial({ color: 0x3a6bd6, transparent: true, opacity: .35 }));
  travLines.frustumCulled = false;
  scene.add(travLines);

  // frame the part itself, ignoring the purge line / start gcode ("Custom")
  const box = new THREE.Box3(), v = new THREE.Vector3();
  const skip = new Set(['Custom', 'Prime tower'].map((n) => data.featNames.indexOf(n)));
  for (let i = 0; i < data.ext.feat.length; i++) {
    if (skip.has(data.ext.feat[i])) continue;
    box.expandByPoint(v.fromArray(data.ext.pos, i * 3));
  }
  if (box.isEmpty()) { g.computeBoundingBox(); box.copy(g.boundingBox); }
  const c = box.getCenter(new THREE.Vector3()), r = Math.max(60, box.getSize(new THREE.Vector3()).length());
  // the model's front is printer -Y before arrange; arrange rotated it by `rot` degrees about Z
  const th = (parseFloat(new URLSearchParams(location.search).get('rot')) || 0) * Math.PI / 180;
  const fx = Math.sin(th), fy = -Math.cos(th);              // rotated (0,-1)
  const front = new THREE.Vector3(fx, 0, -fy), right = new THREE.Vector3(front.z, 0, -front.x);
  controls.target.copy(c);
  const k = Math.max(1, 1.3 / Math.max(camera.aspect, 0.3));
  camera.position.copy(c).addScaledVector(front, r * 1.2 * k).addScaledVector(right, -r * 0.45 * k).add(new THREE.Vector3(0, r * 0.6 * k, 0));

  const layers = data.ext.layerStart.length - 2;
  slider.max = Math.max(1, layers + 1); slider.min = 2; slider.value = slider.max;
  const legend = document.getElementById('legendList'); legend.innerHTML = '';
  data.featNames.forEach((name, i) => {
    const l = document.createElement('label');
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = true;
    cb.onchange = () => { cb.checked ? hidden.delete(i) : hidden.add(i); applyFeatureVisibility(); };
    const sw = document.createElement('i'); sw.style.background = '#' + (FEATURES[name] ?? FEATURES.Other).toString(16).padStart(6, '0');
    l.append(cb, sw, document.createTextNode(name)); legend.append(l);
  });
  for (const id of ['legend', 'layers', 'opts']) document.getElementById(id).hidden = false;
  document.getElementById('msg').textContent = '';
  applyRange();
  initialCam = { p: camera.position.clone(), t: controls.target.clone() };
  post({ type: 'gcodeLoaded', layers });
}

const slider = document.getElementById('slider');
let initialCam = null;
window.gview = {
  set: ({ byTool, travel, single }) => {
    const bt = document.getElementById('byTool');
    if (byTool !== undefined && !document.getElementById('byToolWrap').hidden) bt.checked = byTool;
    if (travel !== undefined) document.getElementById('travel').checked = travel;
    if (single !== undefined) document.getElementById('single').checked = single;
    if (extLines) { applyFeatureVisibility(); applyRange(); }
  },
  resetView: () => { if (initialCam) { camera.position.copy(initialCam.p); controls.target.copy(initialCam.t); } },
};
slider.oninput = applyRange;
document.getElementById('single').onchange = applyRange;
document.getElementById('travel').onchange = applyRange;
document.getElementById('byTool').onchange = () => { applyFeatureVisibility(); };
addEventListener('keydown', (e) => {
  if (e.key === 'ArrowUp' || e.key === 'ArrowRight') { slider.value = +slider.value + 1; applyRange(); }
  if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') { slider.value = +slider.value - 1; applyRange(); }
});

const params = new URLSearchParams(location.search);
const src = params.get('src');
if (src) load(src).catch((e) => { document.getElementById('msg').textContent = 'Could not load G-code: ' + e.message; });
</script>
</body>
</html>
