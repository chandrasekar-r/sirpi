<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Imported GLB</title>
<style>
  html,body { margin:0; height:100%; overflow:hidden; background:#1D1F22; }
  canvas { display:block; }
  #export { position:absolute; right:16px; bottom:16px; height:34px; padding:0 16px; border-radius:999px; border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.08); color:#EDEEF0; font:500 13px -apple-system, system-ui, sans-serif; cursor:pointer; }
</style>
<script type="importmap">
{ "imports": {
  "three": "forge://app/vendor/three/build/three.module.js",
  "three/addons/": "forge://app/vendor/three/examples/jsm/"
} }
</script>
</head>
<body>
<button id="export" type="button">Export GLB</button>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.toneMapping = THREE.NeutralToneMapping; // keeps hues true when environment + lights add up
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
// Neutral studio reflections so metal and glossy PBR materials (e.g. NVIDIA SimReady) read correctly.
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.6;
scene.background = new THREE.Color(0x1d1f22);
const camera = new THREE.PerspectiveCamera(40, 1, 0.01, 1000);
const controls = new OrbitControls(camera, renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 1.3); sun.position.set(3, 6, 4); scene.add(sun);
function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

const gltf = await new GLTFLoader().loadAsync('./asset.glb');
scene.add(gltf.scene);
const box = new THREE.Box3().setFromObject(gltf.scene), c = box.getCenter(new THREE.Vector3()), r = box.getSize(new THREE.Vector3()).length();
controls.target.copy(c);
camera.position.set(c.x + r * 0.8, c.y + r * 0.5, c.z + r * 1.0);
const mixer = gltf.animations.length ? new THREE.AnimationMixer(gltf.scene) : null;
if (mixer) gltf.animations.forEach((a) => mixer.clipAction(a).play());
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => { if (mixer) mixer.update(clock.getDelta()); controls.update(); renderer.render(scene, camera); });

document.getElementById('export').onclick = async () => {
  const blob = await (await fetch('./asset.glb')).blob();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'asset.glb'; a.click();
};
</script>
</body>
</html>
